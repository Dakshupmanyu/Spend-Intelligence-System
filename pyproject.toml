[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spend-intelligence-engine"
version = "0.1.0"
description = "Config-driven spend ingestion, reconciliation, entity resolution and taxonomy classification"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "UNLICENSED - assessment project" }
dependencies = [
  "pandas>=2.1,<4.0",
  "numpy>=1.26,<3.0",
  "PyYAML>=6.0,<7.0",
  "python-dateutil>=2.8,<3.0",
  "rapidfuzz>=3.6,<4.0",
  "fastembed>=0.7,<1.0",
]

[project.optional-dependencies]
embeddings = []  # fastembed is now a core dependency
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.6,<1.0"]

[project.scripts]
spend-engine = "spend_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
